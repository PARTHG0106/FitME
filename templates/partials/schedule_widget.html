 <!-- Floating Today's Schedule Widget -->
<div class="dashboard-schedule-widget" id="dashboardScheduleWidget">
  <div class="dashboard-schedule-header">
    <span><i class="fas fa-calendar-alt mr-2"></i>Today's Schedule</span>
  </div>
  <div class="dashboard-schedule-content" id="dashboardScheduleContent">
    <span>Loading...</span>
  </div>
</div>

<style>
.dashboard-schedule-widget {
  position: fixed;
  bottom: 32px;
  right: 32px;
  width: 260px;
  background: #fff;
  color: #222;
  border-radius: 16px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.12);
  overflow: hidden;
  z-index: 1000;
  transition: height 0.3s, box-shadow 0.3s;
  height: 48px;
  cursor: pointer;
  border: 1px solid #e0e0e0;
}
.dashboard-schedule-header {
  padding: 12px 18px;
  font-weight: 600;
  background: #f7f7f7;
  color: #222;
  font-size: 1rem;
}
.dashboard-schedule-content {
  display: none;
  padding: 16px 18px;
  background: #fff;
  color: #222;
  font-size: 15px;
}
.dashboard-schedule-widget:hover {
  height: 220px; /* Adjust as needed */
  box-shadow: 0 8px 32px rgba(0,0,0,0.18);
}
.dashboard-schedule-widget:hover .dashboard-schedule-content {
  display: block;
}
.dashboard-schedule-widget .dashboard-schedule-content hr {
  margin: 8px 0;
  border: none;
  border-top: 1px solid #eee;
}
.dashboard-schedule-widget .dashboard-schedule-content .view-full-link {
  display: block;
  text-align: right;
  margin-top: 12px;
  color: #888;
  text-decoration: none;
  font-size: 0.95em;
}
</style>

<script>
document.addEventListener("DOMContentLoaded", function() {
  fetch('/api/schedule/today')
    .then(res => res.json())
    .then(data => {
      const content = document.getElementById('dashboardScheduleContent');
      if (data.today && data.today.length > 0) {
        content.innerHTML = data.today.map(item =>
          `<div style='margin-bottom:8px;'>
            <strong>${item.exercise_name}</strong><br>
            <span style='font-size:0.97em;color:#666;'>Sets: ${item.sets}, Reps: ${item.reps}</span>
          </div>`
        ).join('<hr>') + `<a class='view-full-link' href='/schedule'>View Full Schedule &rarr;</a>`;
      } else {
        content.innerHTML = "<span>No exercises scheduled for today</span>" + `<a class='view-full-link' href='/schedule'>View Full Schedule &rarr;</a>`;
      }
    });
});
</script>
